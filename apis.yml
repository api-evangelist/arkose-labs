aid: arkose-labs
name: Arkose Labs
description: >-
  Arkose Labs is a bot management and account-security platform (the Arkose
  Bot Manager / Titan platform) that protects login, registration, and other
  high-value user flows from bots, fraud, and abuse. It combines a client-side
  detection engine and adaptive Enforcement Challenge with a server-side Verify
  API that returns a risk assessment (risk band, score, telltales, IP / device /
  email intelligence, and agent trust) for every session, plus a lightweight
  server-side Edge API for surfaces where client JavaScript cannot run. The
  developer surface includes the Verify API v4, Edge API, Truth Data and
  Retroactive Attack Insights APIs, mobile SDKs (Android, iOS, React Native),
  CDN integrations (Akamai, Cloudflare, Fastly), and a public status page.
